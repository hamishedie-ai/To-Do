<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="theme-color" content="#14233A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>To-do list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper:#EEF1F4; --ink:#14233A; --steel:#5F6F84; --rule:#C9D1DB; --mark:#FFD23F; --marktext:#14233A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0F1B2D; --ink:#EAF0F7; --steel:#8FA1B8; --rule:#27384F; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--paper); }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font:400 21px/1.3 "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    padding:env(safe-area-inset-top) 0 0;
  }
  main { max-width:520px; margin:0 auto; padding:0 20px 150px; }
  h1 {
    font:800 clamp(60px,19vw,92px)/.88 "Bricolage Grotesque", system-ui, sans-serif;
    letter-spacing:-.035em; margin:32px 0 10px;
  }
  .count { font-size:19px; color:var(--steel); margin:0 0 28px; min-height:1.3em; }
  ul { list-style:none; margin:0; padding:0; }
  #todo { border-top:3px solid var(--ink); }
  li {
    display:flex; align-items:center; gap:16px; min-height:66px; padding:10px 2px;
    border-bottom:1px solid var(--rule); cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  li:focus-visible { outline:3px solid var(--ink); outline-offset:-3px; }
  .box {
    width:30px; height:30px; flex:none; border:3px solid var(--ink); border-radius:5px;
    display:grid; place-items:center; transition:background .15s, border-color .15s;
  }
  .box::after {
    content:""; width:8px; height:15px; border:solid var(--marktext); border-width:0 3px 3px 0;
    transform:rotate(45deg) translate(-1px,-2px) scale(0); transition:transform .15s;
  }
  .sweep .box, .done .box { background:var(--mark); border-color:var(--mark); }
  .sweep .box::after, .done .box::after { transform:rotate(45deg) translate(-1px,-2px) scale(1); }
  .t {
    background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 82% / 0% 64%;
    padding:0 .15em; margin:0 -.15em; transition:background-size .42s cubic-bezier(.3,.7,.2,1), color .2s;
    overflow-wrap:anywhere;
  }
  .sweep .t { background-size:100% 64%; color:var(--marktext); }
  .done .t { color:var(--steel); text-decoration:line-through; text-decoration-thickness:2px; }
  .doneHead { display:flex; justify-content:space-between; align-items:center; margin:36px 0 6px; font-weight:700; }
  .doneHead[hidden], .empty[hidden] { display:none; }
  .clear { font:inherit; font-size:17px; font-weight:400; background:none; border:0; color:var(--steel); text-decoration:underline; text-underline-offset:3px; min-height:44px; padding:0 2px; cursor:pointer; }
  .clear:focus-visible, button.add:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  #done { border-top:1px solid var(--rule); }
  .bar {
    position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:3px solid var(--ink); padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  form { max-width:520px; margin:0 auto; display:flex; gap:10px; }
  input {
    flex:1; min-width:0; height:54px; padding:0 14px; border:3px solid var(--ink); border-radius:5px;
    background:transparent; color:var(--ink); font:inherit; font-size:19px;
  }
  input::placeholder { color:var(--steel); }
  button.add {
    height:54px; padding:0 24px; border:0; border-radius:5px; background:var(--ink); color:var(--paper);
    font:700 19px "Atkinson Hyperlegible", system-ui, sans-serif; cursor:pointer;
  }
  @media (prefers-reduced-motion: reduce) { .t, .box, .box::after { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>To-do</h1>
  <p class="count" id="count"></p>
  <ul id="todo"></ul>
  <div class="doneHead" id="doneHead" hidden><span>Done</span><button class="clear" id="clear" type="button">Clear done</button></div>
  <ul id="done"></ul>
</main>
<div class="bar">
  <form id="add"><input id="new" placeholder="Add a job" autocomplete="off" enterkeyhint="done" aria-label="New job"><button class="add" type="submit">Add</button></form>
</div>
<script>
  var KEY = "todo-v5";
  var items = [
    { t: "Aerial", d: false },
    { t: "Car aircon", d: false },
    { t: "Toilet brush", d: false },
    { t: "Strip cable", d: false },
    { t: "Power pass", d: false },
    { t: "Genes", d: false }
  ];
  try { var s = localStorage.getItem(KEY); if (s) items = JSON.parse(s); } catch (e) {}
  
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  function toggle(it, li) {
    if (li.dataset.busy) return;
    function flip(want) { it.d = want; save(); render(); }
    if (!it.d && !calm) {
      li.dataset.busy = "1";
      li.classList.add("sweep");
      li.setAttribute("aria-checked", "true");
      setTimeout(function () { flip(true); }, 560);
    } else {
      flip(!it.d);
    }
  }
  function row(it, ul) {
    var li = document.createElement("li");
    li.className = it.d ? "done" : "";
    li.tabIndex = 0;
    li.setAttribute("role", "checkbox");
    li.setAttribute("aria-checked", it.d ? "true" : "false");
    li.innerHTML = '<span class="box"></span><span class="t"></span>';
    li.querySelector(".t").textContent = it.t;
    li.onclick = function () { toggle(it, li); };
    li.onkeydown = function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(it, li); } };
    ul.appendChild(li);
  }
  function render() {
    var a = document.getElementById("todo"), b = document.getElementById("done");
    a.innerHTML = ""; b.innerHTML = "";
    var left = 0, done = 0;
    items.forEach(function (it) { if (it.d) { row(it, b); done++; } else { row(it, a); left++; } });
    document.getElementById("count").textContent = left > 0 ? left + " to go" : "Nothing left. Add the next job below.";
    document.getElementById("doneHead").hidden = done === 0;
  }
  document.getElementById("add").onsubmit = function (e) {
    e.preventDefault();
    var inp = document.getElementById("new"), v = inp.value.trim();
    if (v) { items.push({ t: v, d: false }); inp.value = ""; save(); render(); }
  };
  document.getElementById("clear").onclick = function () {
    items = items.filter(function (x) { return !x.d; }); save(); render();
  };
  render();

</script>
</body>
</html>
